<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de renta | Elite MIG 300</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="detail-page page-enter">
  <header class="topbar">
    <a href="menu.html" class="brand animated-link">RENTAS MIG</a>
    <a href="menu.html" class="back-link animated-link">← Menú</a>
  </header>

  <main class="detail-container">
    <section class="detail-panel">
      <div class="detail-copy">
        <p class="eyebrow" id="detailEyebrow">OPCIÓN DE RENTA</p>
        <h1 id="detailTitle">Renta diaria</h1>
        <p class="detail-description" id="detailDescription">
          Elite MIG 300.
        </p>

        <div class="detail-price" id="detailPrice">$650</div>

        <div class="detail-info">
          <div>
            <span>Equipo</span>
            <strong id="detailEquipment">Elite MIG 300</strong>
          </div>
          <div>
            <span>Modalidad</span>
            <strong id="detailMode">1 día</strong>
          </div>
        </div>

        <div class="detail-actions">
          <a href="menu.html" class="secondary-button animated-link">← Elegir otra opción</a>

          <!-- CAMBIA 5210000000000 POR TU NÚMERO REAL -->
          <a
            id="detailWhatsapp"
            class="whatsapp-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            SOLICITAR INFORMES
          </a>
        </div>
      </div>

      <div class="detail-visual">
        <div class="machine-glow"></div>
        <img src="renta-mig.png" alt="Elite MIG 300" />
        <div class="detail-badge">
          <span>ELITE</span>
          <strong>MIG 300</strong>
        </div>
      </div>
    </section>
  </main>

  <div class="page-wipe" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
